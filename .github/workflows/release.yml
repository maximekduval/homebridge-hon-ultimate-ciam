name: Release

# Publishes the package to npm when a version tag such as v2.2.2 is pushed.
#
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored
# in GitHub. The trusted publisher must be configured once on npmjs.com, in the
# package settings, for this repository and this workflow file name
# (release.yml).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches package.json and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prepack runs the type check, the tests and the build before packing.
      - name: Publish
        run: npm publish
